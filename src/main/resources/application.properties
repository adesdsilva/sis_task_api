spring.application.name=sis_task_manager

# Configurações para PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/sis_task
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# application.properties
spring.profiles.active=@activatedProperties@

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui-custom.html
springdoc.swagger-ui.operationsSorter=method

jwt.secret=my_secret_password_123456

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.core.userdetails=DEBUG

#Java mail
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=your-email@example.com
spring.mail.password=your-email-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#GraphQl
spring.graphql.graphiql.enabled=true








